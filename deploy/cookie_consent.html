    <!-- Cookie Consent Banner - GDPR/AP Compliant -->
    <div id="cookie-consent" class="cookie-banner" role="alertdialog" aria-labelledby="cookie-title" aria-describedby="cookie-desc">
        <div class="cookie-content">
            <h3 id="cookie-title">We use cookies</h3>
            <p id="cookie-desc">We use essential cookies for basic functionality and anonymous analytics (Umami) to understand how our website is used. Umami does not collect personally identifiable information and respects Do Not Track. You can accept or decline analytics cookies.</p>
            <div class="cookie-actions">
                <button id="accept-cookies" class="cookie-button primary" aria-label="Accept analytics cookies">Accept</button>
                <button id="decline-cookies" class="cookie-button secondary" aria-label="Decline analytics cookies">Decline</button>
            </div>
            <a href="/privacy.html" class="cookie-link" aria-label="Read our privacy policy">Privacy Policy</a>
        </div>
    </div>
    
    <style>
        .cookie-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            padding: 1.5rem;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
            z-index: 10000;
            border-top: 1px solid #e5e7eb;
            display: none;
            transition: all 0.3s ease;
        }
        .cookie-banner.visible {
            display: block;
        }
        .cookie-content {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        .cookie-content h3 {
            font-family: 'Poppins', 'Arial Black', Impact, sans-serif;
            font-weight: 700;
            color: #000;
            margin-bottom: 0.75rem;
            font-size: 1.25rem;
        }
        .cookie-content p {
            color: #374151;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        .cookie-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .cookie-button {
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
        }
        .cookie-button.primary {
            background: #2563eb;
            color: #fff;
        }
        .cookie-button.primary:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(37, 99, 235, 0.3);
        }
        .cookie-button.secondary {
            background: #f3f4f6;
            color: #374151;
        }
        .cookie-button.secondary:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .cookie-button:focus {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
        }
        .cookie-link {
            color: #2563eb;
            text-decoration: underline;
            font-size: 0.9rem;
            display: inline-block;
            margin-top: 0.5rem;
        }
        .cookie-link:hover {
            color: #1d4ed8;
        }
        @media (max-width: 768px) {
            .cookie-banner {
                padding: 1rem;
            }
            .cookie-content h3 {
                font-size: 1.1rem;
            }
            .cookie-content p {
                font-size: 0.9rem;
            }
            .cookie-actions {
                flex-direction: column;
                gap: 0.5rem;
            }
            .cookie-button {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
    
    <script>
        // Cookie consent functionality - GDPR/AP Compliant
        document.addEventListener('DOMContentLoaded', function() {
            // Check if consent exists and is not expired (1 year = 31536000000 ms)
            const consent = localStorage.getItem('cookieConsent');
            const consentData = consent ? JSON.parse(consent) : null;
            const banner = document.getElementById('cookie-consent');
            
            if (!banner) return;
            
            // Show banner if no consent or consent is expired
            if (!consentData || !consentData.value || !consentData.timestamp || 
                (Date.now() - consentData.timestamp) > 31536000000) {
                banner.classList.add('visible');
                // Set initial focus for accessibility
                banner.setAttribute('aria-hidden', 'false');
            }
            
            // Accept - store consent with timestamp
            document.getElementById('accept-cookies')?.addEventListener('click', function() {
                localStorage.setItem('cookieConsent', JSON.stringify({
                    value: 'true',
                    timestamp: Date.now()
                }));
                banner.classList.remove('visible');
                banner.setAttribute('aria-hidden', 'true');
                // Reload to apply analytics consent
                location.reload();
            });
            
            // Decline - store decline with timestamp
            document.getElementById('decline-cookies')?.addEventListener('click', function() {
                localStorage.setItem('cookieConsent', JSON.stringify({
                    value: 'false',
                    timestamp: Date.now()
                }));
                banner.classList.remove('visible');
                banner.setAttribute('aria-hidden', 'true');
                // Reload to apply analytics decline
                location.reload();
            });
        });
    </script>
