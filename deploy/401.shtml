<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Remote Labs - 401 Unauthorized">
    <meta name="theme-color" content="#000">
    <!--
      Content-Security-Policy is delivered via <meta> as a fallback.
      The security headers that browsers ignore as meta tags
      (X-Frame-Options, X-Content-Type-Options, Referrer-Policy,
      Strict-Transport-Security, Permissions-Policy) are sent as real
      HTTP response headers via .htaccess.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'">
    <title>Remote Labs - 401 Unauthorized</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @font-face { font-family: 'Poppins Fallback'; src: local('Arial Black'), local('Impact'), local('sans-serif'); font-weight: 700; }
        body {
            font-family: 'Lato', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #000;
            background: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }
        .logo {
            font-family: 'Poppins', 'Poppins Fallback', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: #000;
            text-decoration: none;
            margin-bottom: 2rem;
        }
        .error-code {
            font-family: 'Poppins', 'Poppins Fallback', sans-serif;
            font-size: 6rem;
            font-weight: 700;
            color: #000;
            margin-bottom: 1rem;
            line-height: 1;
        }
        .error-title {
            font-family: 'Poppins', 'Poppins Fallback', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            line-height: 1.2;
            color: #000;
        }
        .error-description {
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto 2.5rem;
            line-height: 1.6;
            color: #666;
        }
        .home-button {
            background: #000;
            color: #fff;
            padding: .85rem 1.5rem;
            border-radius: 3px;
            text-decoration: none;
            font-weight: 700;
            font-size: .95rem;
            transition: opacity 0.2s ease;
            display: inline-block;
        }
        .home-button:hover {
            opacity: 0.85;
        }
        .home-button:focus {
            outline: 2px solid #000;
            outline-offset: 2px;
        }
        @media (max-width: 768px) {
            .error-code { font-size: 4rem; }
            .error-title { font-size: 2rem; }
            .error-description { font-size: 1rem; }
        }
        @media (max-width: 480px) {
            .error-code { font-size: 3rem; }
            body { padding: 1rem; }
        }
    </style>
</head>
<body>
    <a href="/" class="logo" aria-label="Remote Labs homepage">Remote Labs</a>
    <div class="error-container">
        <div class="error-code">401</div>
        <h1 class="error-title">Unauthorized</h1>
        <p class="error-description">You are not authorized to access this page. Please login or check your credentials.</p>
        <a href="/" class="home-button" aria-label="Return to homepage">Return to Homepage</a>
    </div>
</body>
</html>
