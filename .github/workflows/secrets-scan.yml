name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Full-history scan once a week
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history for the scheduled scan

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          # Gitleaks license key, stored as a repository secret
          # (Settings -> Secrets and variables -> Actions -> GITLEAKS_LICENSE).
          # If unset/empty the scan simply runs unlicensed.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
