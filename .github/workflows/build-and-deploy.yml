name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          cd production_source
          npm install

      - name: Run source consistency tests
        run: |
          cd production_source
          npm test

      - name: Run build
        run: |
          cd production_source
          npm run build:full

      - name: Verify build
        run: |
          ls -la deploy/styles.min.css deploy/script.min.js deploy/index.html deploy/privacy.html deploy/sw.js deploy/assets/

      - name: Check link and asset integrity
        run: node scripts/check-links.js deploy

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14
          lhci autorun --config=lighthouserc.json

      - name: Commit build artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add deploy/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-build: Update minified assets [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
