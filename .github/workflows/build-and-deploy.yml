name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd production_source
          npm install

      - name: Build CSS
        run: |
          cd production_source
          npm run build:css

      - name: Build JavaScript
        run: |
          cd production_source
          npm run build:js

      - name: Copy HTML files
        run: |
          cd production_source
          npm run build:html

      - name: Verify build
        run: |
          ls -la deploy/styles.min.css deploy/script.min.js deploy/index.html deploy/privacy.html

      - name: Commit build artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add deploy/styles.min.css deploy/script.min.js deploy/index.html deploy/privacy.html
          git diff --cached --quiet || git commit -m "Auto-build: Update minified assets"
          git push
