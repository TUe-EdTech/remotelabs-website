name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read # default; the job below escalates only what it needs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only needed to auto-commit rebuilt deploy/ on main

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: production_source/package-lock.json

      - name: Install dependencies
        run: |
          cd production_source
          npm ci

      - name: Audit dependencies for known vulnerabilities
        run: |
          cd production_source
          npm audit --audit-level=high

      - name: Run source consistency tests
        run: |
          cd production_source
          npm test

      - name: Run build
        run: |
          cd production_source
          npm run build:full

      - name: Verify build
        run: |
          ls -la deploy/styles.min.css deploy/script.min.js deploy/index.html deploy/privacy.html deploy/sw.js deploy/assets/

      - name: Check link and asset integrity
        run: node scripts/check-links.js deploy

      - name: Check the built site actually renders styled
        run: |
          cd production_source
          npm run test:render

      - name: Run Lighthouse CI
        # @lhci/cli is a devDependency pinned by package-lock.json (npm ci
        # above), so the runner executes the lockfile version, not a
        # runtime-resolved tag. Commit of the published release:
        # b0c42f47e6abef0801e90e7ef54e2b22c4c1443f (v0.16.1).
        run: node production_source/node_modules/@lhci/cli/src/cli.js autorun --config=lighthouserc.json

      - name: Commit build artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add deploy/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-build: Update minified assets [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
